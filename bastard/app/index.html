<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/bastard/app/">

  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A gratitude journal with absolutely no patience for your excuses.">
  <meta name="theme-color" content="#00181E">

  <!-- Reset browser defaults and paint the page bg the same as the card top
       so the iOS status bar (which extends over the page with
       apple-mobile-web-app-status-bar-style=black-translucent) blends
       seamlessly with the card and there is no 1px seam. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #00181E;
      overflow: hidden;
      /* Skip iOS Safari's 300ms double-tap-zoom delay AND its synthetic
         "first tap is a hover" emulation on PWA standalone, both of which
         caused buttons to require two taps on iOS. */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Install instructions overlay.
       Hidden by default; install_overlay.js adds .ub-show-install-overlay
       to <html> when ?install=1 is present, which reveals it. The overlay
       sits on top of Flutter (which loads in the background) so the user
       reads the steps while on the actual PWA URL — making Chrome's
       "Install app" install the correct PWA, not a screenshot shortcut.

       Layout notes:
       - The outer .ub-install-overlay is the scroll container (fixed to the
         viewport, full height via 100dvh so it tracks the dynamic mobile
         viewport when the URL bar shows/hides).
       - The close button is position:fixed against the viewport so it
         never scrolls away and is always reachable, regardless of how
         tall the step content gets on large devices.
       - All content lives inside .ub-install-inner which is normal flow
         inside the scroll container with safe-area padding. */
    .ub-install-overlay { display: none; }
    .ub-show-install-overlay { overflow: hidden; }
    .ub-show-install-overlay .ub-install-overlay {
      display: block;
      position: fixed;
      top: 0; left: 0; right: 0;
      bottom: 0;
      height: 100vh;        /* fallback */
      height: 100dvh;       /* dynamic viewport — handles iOS URL bar */
      z-index: 2147483647;
      background: #00181E;
      color: #fff;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .ub-install-close {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(13, 43, 51, 0.95);
      border: none;
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      z-index: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ub-install-close:active { opacity: 0.7; }
    .ub-install-inner {
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Top padding clears the fixed close button. */
      padding: calc(76px + env(safe-area-inset-top, 0px))
               max(20px, env(safe-area-inset-right, 20px))
               calc(40px + env(safe-area-inset-bottom, 0px))
               max(20px, env(safe-area-inset-left, 20px));
    }
    .ub-install-logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .ub-install-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.3px;
      text-align: center;
      margin-bottom: 8px;
    }
    .ub-install-sub {
      font-size: 14px;
      color: #aaa;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .ub-install-steps { width: 100%; }
    .ub-step {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      background: #0d2b33;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .ub-step-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #fff;
      color: #00181E;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ub-step-body {
      flex: 1;
      min-width: 0;
      font-size: 14.5px;
      line-height: 1.45;
      color: #ddd;
    }
    .ub-step-body strong { color: #fff; font-weight: 700; }
    .ub-step-icon {
      width: 40px; height: 40px;
      border-radius: 11px;
      background: #00181E;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ub-install-foot {
      margin-top: 18px;
      font-size: 13px;
      color: #777;
      text-align: center;
      line-height: 1.5;
    }
    .ub-install-foot strong { color: #aaa; font-weight: 600; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ungrateful Bastard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ungrateful Bastard</title>
  <link rel="manifest" href="manifest.json">

  <!-- Install instructions overlay handler. External file because the CSP
       above forbids inline scripts (script-src 'self' without 'unsafe-inline').
       Loaded blocking (no async/defer) so the .ub-show-install-overlay class
       is set on <html> before <body> is painted — no flash of Flutter
       behind the overlay in browser mode.

       This script is now responsible for loading flutter_bootstrap.js as
       well: it only injects it when running as an installed PWA (display
       mode = standalone). In a regular browser tab Flutter never loads —
       the install overlay is all the user sees. -->
  <script src="install_overlay.js"></script>
</head>
<body>
  <!-- Install instructions overlay. Hidden by default via CSS; revealed
       when install_overlay.js sets .ub-show-install-overlay on <html>. -->
  <div class="ub-install-overlay" id="ub-install-overlay" role="dialog" aria-modal="true" aria-labelledby="ub-install-title">
    <button class="ub-install-close" id="ub-install-close" type="button" aria-label="Close">&times;</button>
    <div class="ub-install-inner">
      <img class="ub-install-logo" src="icons/Icon-192.png" alt="">
      <div class="ub-install-title" id="ub-install-title">Install Ungrateful Bastard</div>
      <div class="ub-install-sub">Follow these 3 steps to add the app to your home screen.</div>
      <div class="ub-install-steps" id="ub-install-steps"></div>
      <div class="ub-install-foot" id="ub-install-foot"></div>
    </div>
  </div>

  <!--
    Flutter is loaded dynamically by install_overlay.js, and only when
    the page is running in PWA standalone mode (i.e. launched from the
    home screen). In a regular browser tab the install overlay shows
    instead and Flutter never boots — we don't want users seeing the
    half-rendered app in a tab.
  -->
</body>
</html>
