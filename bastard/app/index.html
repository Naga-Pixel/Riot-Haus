<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Un diario della gratitudine con l'allergia alle cazzate.">
  <meta name="theme-color" content="#00181E">

  <!-- Reset browser defaults and paint the page bg the same as the card top
       so the iOS status bar blends seamlessly with no 1px seam. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #00181E;
      overflow: hidden;
      /* Skip iOS Safari's 300ms double-tap-zoom delay and synthetic hover. */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #root { height: 100dvh; }

    /* Install instructions overlay. Hidden by default; install_overlay.js
       adds .ub-show-install-overlay to <html> when NOT running standalone. */
    .ub-install-overlay { display: none; }
    .ub-show-install-overlay { overflow: hidden; }
    .ub-show-install-overlay .ub-install-overlay {
      display: block;
      position: fixed;
      top: 0; left: 0; right: 0;
      bottom: 0;
      height: 100vh;
      height: 100dvh;
      z-index: 2147483647;
      background: #00181E;
      color: #fff;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .ub-install-close {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(13, 43, 51, 0.95);
      border: none;
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      z-index: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ub-install-close:active { opacity: 0.7; }
    .ub-install-inner {
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(76px + env(safe-area-inset-top, 0px))
               max(20px, env(safe-area-inset-right, 20px))
               calc(40px + env(safe-area-inset-bottom, 0px))
               max(20px, env(safe-area-inset-left, 20px));
    }
    .ub-install-logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .ub-install-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.3px;
      text-align: center;
      margin-bottom: 8px;
    }
    .ub-install-sub {
      font-size: 14px;
      color: #aaa;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .ub-install-steps { width: 100%; }
    .ub-step {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      background: #0d2b33;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .ub-step-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #fff;
      color: #00181E;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ub-step-body {
      flex: 1;
      min-width: 0;
      font-size: 14.5px;
      line-height: 1.45;
      color: #ddd;
    }
    .ub-step-body strong { color: #fff; font-weight: 700; }
    .ub-step-icon {
      width: 40px; height: 40px;
      border-radius: 11px;
      background: #00181E;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ub-install-foot {
      margin-top: 18px;
      font-size: 13px;
      color: #777;
      text-align: center;
      line-height: 1.5;
    }
    .ub-install-foot strong { color: #aaa; font-weight: 600; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ungrateful Bastard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ungrateful Bastard</title>
  <link rel="manifest" href="manifest.json">

  <!-- Install gate / overlay. Runs before the app mounts (no defer) so the
       overlay class is set on <html> before first paint. -->
  <script src="install_overlay.js"></script>
  <script type="module" crossorigin src="/bastard/app/assets/index-DvG9ALRD.js"></script>
  <link rel="stylesheet" crossorigin href="/bastard/app/assets/index-Cq5UunkX.css">
</head>
<body>
  <!-- Install instructions overlay. Hidden by default via CSS. -->
  <div class="ub-install-overlay" id="ub-install-overlay" role="dialog" aria-modal="true" aria-labelledby="ub-install-title">
    <button class="ub-install-close" id="ub-install-close" type="button" aria-label="Chiudi">&times;</button>
    <div class="ub-install-inner">
      <img class="ub-install-logo" src="icons/Icon-192.png" alt="">
      <div class="ub-install-title" id="ub-install-title">Installa Ungrateful Bastard</div>
      <div class="ub-install-sub">Segui questi 3 passaggi per aggiungere l'app alla schermata Home.</div>
      <div class="ub-install-steps" id="ub-install-steps"></div>
      <div class="ub-install-foot" id="ub-install-foot"></div>
    </div>
  </div>

  <div id="root"></div>
</body>
</html>
