<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/bastard/app/">

  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com; worker-src 'self' blob:; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A gratitude journal with absolutely no patience for your excuses.">
  <meta name="theme-color" content="#00181E">

  <!-- Reset browser defaults and paint the page bg the same as the card top
       so the iOS status bar (which extends over the page with
       apple-mobile-web-app-status-bar-style=black-translucent) blends
       seamlessly with the card and there is no 1px seam. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #00181E;
      overflow: hidden;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ungrateful Bastard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ungrateful Bastard</title>
  <link rel="manifest" href="manifest.json">

  <!-- PWA install handler.
       Captures Chrome's `beforeinstallprompt` as soon as it fires (the event
       only fires once per page load and is the only way to programmatically
       open the install dialog).

       When this page is loaded with ?install=1 (handoff from the install
       landing page at /bastard/install/), we trigger the dialog as soon as
       the captured event is available. If the browser has suppressed it
       (already installed, recently dismissed, engagement heuristics not met,
       iOS, etc.) we show a small fallback toast pointing the user at the
       browser's manual "Install app" menu, rather than leaving them staring
       at the splash wondering what happened. -->
  <script>
    (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        window.dispatchEvent(new Event('pwa-install-ready'));
      });
      window.addEventListener('appinstalled', function () {
        deferred = null;
        try { localStorage.setItem('ub-pwa-installed', '1'); } catch (_) {}
      });

      var params = new URLSearchParams(window.location.search);
      if (params.get('install') !== '1') return;

      // Strip the param so refreshes / shares / back-navigations don't
      // re-trigger the dialog.
      var clean = new URL(window.location.href);
      clean.searchParams.delete('install');
      history.replaceState({}, '', clean.toString());

      var resolved = false;
      function fire() {
        if (resolved || !deferred) return;
        resolved = true;
        var ev = deferred; deferred = null;
        ev.prompt();
        ev.userChoice.then(function (choice) {
          if (choice && choice.outcome === 'accepted') {
            try { localStorage.setItem('ub-pwa-installed', '1'); } catch (_) {}
          }
        }).catch(function () {});
      }
      window.addEventListener('pwa-install-ready', fire);
      // If the event already fired before this listener attached, catch it.
      setTimeout(fire, 0);

      // No event within 4s -> Chrome has suppressed the prompt. Surface a
      // hint instead of silently swallowing the click.
      setTimeout(function () {
        if (resolved) return;
        if (deferred) { fire(); return; }
        var n = document.createElement('div');
        n.textContent =
          "Install dialog unavailable. Open the browser menu and choose " +
          "'Install app' or 'Add to Home screen'.";
        n.setAttribute('style',
          'position:fixed;left:16px;right:16px;bottom:24px;z-index:2147483647;' +
          'background:#0d2b33;color:#fff;padding:14px 16px;border-radius:12px;' +
          'font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;' +
          'box-shadow:0 8px 24px rgba(0,0,0,.4);line-height:1.4;' +
          'opacity:0;transition:opacity .2s;');
        var attach = function () {
          if (!document.body) { setTimeout(attach, 50); return; }
          document.body.appendChild(n);
          requestAnimationFrame(function () { n.style.opacity = '1'; });
          setTimeout(function () {
            n.style.opacity = '0';
            setTimeout(function () { n.remove(); }, 250);
          }, 7000);
        };
        attach();
      }, 4000);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
