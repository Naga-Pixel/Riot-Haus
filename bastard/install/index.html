<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Install — Ungrateful Bastard</title>
  <style>
    @font-face {
      font-family: 'ZalandoSansExpanded';
      src: url('../assets/fonts/ZalandoSansExpanded-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #00181E;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 32px;
      object-fit: cover;
    }

    h1 {
      font-family: 'ZalandoSansExpanded', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      text-align: center;
    }

    .tagline {
      font-size: 15px;
      color: #aaa;
      text-align: center;
      margin-bottom: 56px;
      line-height: 1.5;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 320px;
      padding: 18px 24px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.1px;
      text-decoration: none;
      transition: opacity 0.15s;
      margin-bottom: 14px;
      background: #fff;
      color: #00181E;
      text-align: left;
      font-family: inherit;
    }
    .btn:active { opacity: 0.75; }
    .btn svg, .btn img { flex-shrink: 0; }
    .btn-label { display: flex; flex-direction: column; }
    .btn-label span:first-child { font-size: 11px; font-weight: 500; opacity: 0.6; }
    .btn-label span:last-child { font-size: 16px; font-weight: 800; }

    .open-link {
      color: #aaa;
      font-size: 14px;
      text-decoration: none;
      border-bottom: 1px solid #444;
      padding-bottom: 2px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <img src="../app/icons/Icon-192.png" alt="Ungrateful Bastard" class="logo">
  <h1>Ungrateful Bastard</h1>
  <p class="tagline">A gratitude journal with absolutely<br>no patience for your excuses.</p>

  <!-- Single install button. Click navigates to /bastard/app/?install=1
       where the Flutter app shell renders a fullscreen instruction
       overlay before Flutter loads.

       The install MUST happen from /bastard/app/ — that's where the
       manifest and service worker live. Installing from here would
       only produce a webclip shortcut to this landing page, not the
       PWA itself. -->
  <a id="install-btn" class="btn" href="../app/?install=1">
    <span id="install-btn-icon" aria-hidden="true"></span>
    <span class="btn-label">
      <span id="install-btn-eyebrow">Get the app</span>
      <span id="install-btn-label">Install</span>
    </span>
  </a>

  <a href="../app/" class="open-link">Open in browser instead</a>

  <script>
    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/.test(ua);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;

    const ICON_APPLE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#00181E"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>';
    const ICON_ANDROID = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#00181E"><path d="M17.523 15.341a1 1 0 1 1-1.001-1.732 1 1 0 0 1 1.001 1.732m-11.046 0a1 1 0 1 1-1.001-1.732 1 1 0 0 1 1.001 1.732m11.405-6.02 1.997-3.46a.416.416 0 0 0-.72-.416l-2.022 3.503A12.5 12.5 0 0 0 12 7.665c-1.84 0-3.585.41-5.137 1.142L4.84 5.305a.416.416 0 0 0-.72.416L6.117 9.18C2.68 11.05.314 14.554 0 18.667h24c-.313-4.113-2.68-7.616-6.118-9.486"/></svg>';

    function isInstalled() {
      if (isStandalone) return true;
      try { return localStorage.getItem('ub-pwa-installed') === '1'; }
      catch (_) { return false; }
    }

    function paint() {
      const btn = document.getElementById('install-btn');
      const iconSlot = document.getElementById('install-btn-icon');
      const eyebrow = document.getElementById('install-btn-eyebrow');
      const label = document.getElementById('install-btn-label');

      iconSlot.innerHTML = isIOS ? ICON_APPLE : ICON_ANDROID;

      if (isInstalled()) {
        btn.href = '../app/';
        eyebrow.textContent = 'Already installed';
        label.textContent = 'Open app';
      } else {
        btn.href = '../app/?install=1';
        eyebrow.textContent = 'Get the app';
        label.textContent = isIOS ? 'Add to iPhone'
                           : isAndroid ? 'Install on Android'
                           : 'Install app';
      }
    }

    paint();

    window.addEventListener('storage', (e) => {
      if (e.key === 'ub-pwa-installed') paint();
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) paint();
    });
  </script>

</body>
</html>
